[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghcn-spark-analysis"
version = "1.0.0"
description = "Scalable analysis of the GHCN-Daily climate dataset with Apache Spark (DATA420-26S2 Assignment 1)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ahmed Masoom Butt" }]
keywords = ["spark", "pyspark", "ghcn", "climate-data", "azure", "geospatial"]

dependencies = [
    "pyspark>=3.4,<4.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "pycountry>=23.12",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "folium>=0.15", "mapclassify>=2.6"]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0", "jupyter>=1.0", "ipykernel>=6.29", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
